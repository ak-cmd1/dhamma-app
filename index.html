<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>経典</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="経典">
<link rel="apple-touch-icon" href="icon-180.png?v=64">
<link rel="icon" href="icon-192.png?v=64">

<link rel="stylesheet" href="style.css?v=64">
</head>
<body>

<main id="app">

  <!-- 画面0:始める(唯一のタップ。ここで音の許可を取る) -->
  <section id="screen-start" class="screen center">
    <p class="start-date" id="start-date"></p>
    <h1 class="start-title">経典</h1>
    <p class="start-lead">目を閉じたまま、坐まで案内します。</p>
    <div class="actions">
      <button class="btn-primary" id="start-btn">始める</button>
    </div>

    <!-- 坐りかけがある日だけ出る -->
    <button class="link-btn" id="resume-btn" hidden></button>

    <!-- 新しい版が来ているときだけ出る。自動で読み直すと、
         読み直しが繰り返されて画面に触れても反応しなくなるため、
         切り替えるかどうかは押して決めてもらう。 -->
    <button class="link-btn" id="update-btn" hidden>新しい版があります ── 切り替える</button>

    <div class="start-links">
      <!-- 今日の蓋が実感と合わない日は、こちらから選び直せる -->
      <button class="link-btn" id="choose-btn">今日の気分から選ぶ</button>
      <button class="link-btn faint" id="settings-btn">設定</button>
    </div>

    <!-- どの版を見ているか、ひと目で分かるようにする。
         古い版が端末に残っていると「作ったのに無い」が起きるため。 -->
    <p class="build-tag" id="build-tag"></p>
  </section>

  <!-- 画面0c:気分から選ぶ(目を閉じる前の段階なので、ここだけ操作が入る) -->
  <section id="screen-choose" class="screen" hidden>
    <p class="eyebrow">今日は</p>
    <h1 class="question">どんな気分ですか</h1>
    <div class="choices" id="choices"></div>
    <button class="link-btn" id="choose-back-btn">戻る</button>
  </section>

  <!-- 画面0s:設定 -->
  <section id="screen-settings" class="screen" hidden>
    <!-- 設定は項目が多く、下の「戻る」が画面の外へ出てしまう。
         上に、常に見えている戻り口を置く。 -->
    <div class="settings-top">
      <button class="back-btn" id="settings-back-top">← 戻る</button>
      <span class="settings-title">設定</span>
    </div>

    <div class="setting-row">
      <p class="setting-label">坐る長さ</p>
      <div class="setting-choices" id="duration-choices"></div>
    </div>

    <div class="setting-row">
      <p class="setting-label">声で案内する</p>
      <div class="setting-choices" id="voice-choices"></div>
      <p class="setting-note" id="voice-note"></p>
    </div>

    <div class="setting-row">
      <p class="setting-label">声の速さ <span class="setting-value" id="rate-value"></span></p>
      <input class="slider" type="range" id="rate-slider"
             min="0.6" max="1.5" step="0.1" value="0.8"
             aria-label="声の速さ">
      <div class="slider-ends"><span>0.6倍</span><span>1.5倍</span></div>
    </div>

    <div class="setting-row">
      <p class="setting-label">テンポ(間の長さ)</p>
      <div class="setting-choices" id="tempo-choices"></div>
      <p class="setting-note" id="tempo-note"></p>
    </div>

    <div class="setting-row">
      <p class="setting-label">はじめの呼吸</p>
      <div class="setting-choices" id="breath-choices"></div>
    </div>

    <div class="setting-row">
      <p class="setting-label">背景の絵</p>
      <div class="setting-choices" id="keshiki-choices"></div>
      <p class="setting-note">経典を読んでいるあいだだけ、その経典の場面を薄く描きます。坐っているあいだは何も動きません。端末で「動きを減らす」を選んでいるときは自動で出ません。</p>
    </div>

    <div class="setting-row">
      <p class="setting-label">音声をこの端末に入れる</p>
      <div class="setting-choices">
        <button class="chip" id="fetch-audio-btn">まとめて入れる</button>
      </div>
      <p class="setting-note" id="fetch-audio-note"></p>
      <div class="fetch-bar" id="fetch-bar" hidden><span id="fetch-fill"></span></div>
    </div>

    <!-- 音が出ないときのための確認。端末が何を返しているかをそのまま出す。 -->
    <div class="setting-row">
      <p class="setting-label">音の確認</p>
      <div class="setting-choices">
        <button class="chip" id="test-voice-btn">声を試す</button>
        <button class="chip" id="test-bell-btn">鐘を試す</button>
        <button class="chip" id="test-breath-btn">呼吸の音</button>
      </div>
      <p class="setting-note" id="test-result">押すと、その場で鳴らします。</p>
      <p class="setting-note faint-note" id="device-info"></p>
    </div>

    <div class="actions">
      <button class="btn-primary" id="settings-done-btn">戻る</button>
    </div>

    <p class="credit">読み上げの声:VOICEVOX 青山龍星</p>
  </section>

  <!-- 画面1:三帰依 -->
  <section id="screen-refuge" class="screen center" hidden>
    <div class="refuge-list" id="refuge-list"></div>
  </section>

  <!-- 画面2:呼吸 -->
  <section id="screen-open" class="screen center" hidden>
    <!-- 六つの円が、息に合わせて開いて閉じる。重なりが花のように見える。 -->
    <div class="breath-stage" id="breath-circle">
      <div class="breath-halo"></div>
      <div class="breath-petals" id="breath-petals">
        <span class="petal" style="--a:0deg"></span>
        <span class="petal" style="--a:60deg"></span>
        <span class="petal" style="--a:120deg"></span>
        <span class="petal" style="--a:180deg"></span>
        <span class="petal" style="--a:240deg"></span>
        <span class="petal" style="--a:300deg"></span>
      </div>
    </div>
    <p class="breath-guide" id="breath-guide">吸って</p>
    <p class="breath-count" id="breath-count"></p>
  </section>

  <!-- 画面3:身体を整える(経典より先。ここで坐る姿勢になる) -->
  <section id="screen-posture" class="screen center" hidden>
    <p class="posture-text" id="posture-text"></p>
  </section>

  <!-- 画面4:今日の一節(坐った姿勢のまま聴く) -->
  <section id="screen-passage" class="screen" hidden>
    <p class="daily-lead">今日の一節</p>
    <div class="daily-card">
      <p class="daily-sutra" id="passage-sutra"></p>
      <div class="daily-text" id="passage-text"></div>
    </div>
    <button class="link-btn faint" id="skip-btn" hidden>読まずに坐る</button>
    <button class="link-btn" id="reread-close" hidden>閉じる</button>
  </section>

  <!-- 画面4b:発心 ── 坐へ向かわせる一撃。ここが弱いと「よし坐ろう」にならない -->
  <section id="screen-hosshin" class="screen center" hidden>
    <p class="hosshin-sutra" id="hosshin-sutra"></p>
    <div class="hosshin-text" id="hosshin-text"></div>
  </section>

  <!-- 画面5:締め + 今日の坐り方(このあとすぐ鐘) -->
  <section id="screen-closing" class="screen center" hidden>
    <p class="closing-text" id="closing-text"></p>
    <p class="closing-note" id="closing-note"></p>
    <div class="method-block">
      <p class="method-lead">今日の坐り方</p>
      <p class="method-name" id="method-name"></p>
      <p class="method-short" id="method-short"></p>
    </div>
    <div class="closing-links">
      <button class="link-btn faint" id="walk-btn" hidden>坐らずに歩く(経行)</button>
      <button class="link-btn faint" id="cannot-sit-btn">今日は坐れない</button>
    </div>
  </section>

  <!-- 画面9:坐っている -->
  <section id="screen-sitting" class="screen center" hidden>
    <div class="still-circle"></div>
    <p class="sitting-short" id="sitting-short"></p>
    <button class="link-btn faint" id="stop-btn">やめる</button>
  </section>

  <!-- 画面10:坐り終えたあとの問い -->
  <section id="screen-after" class="screen center" hidden>
    <p class="after-inquiry" id="after-inquiry"></p>
    <button class="link-btn" id="sit-again-btn" hidden>まだ残っている ── もう一度坐る</button>
  </section>

  <!-- 画面12:回向 -->
  <section id="screen-dedication" class="screen center" hidden>
    <p class="dedication-lead">回向</p>
    <p class="dedication-text" id="dedication-text"></p>
    <div class="dedication-pali" id="dedication-pali"></div>
  </section>

  <!-- 画面13:終わり -->
  <section id="screen-done" class="screen center" hidden>
    <p class="done-text">終わりました。</p>
    <div class="start-links">
      <button class="link-btn" id="reread-btn">今日の一節をもう一度</button>
      <button class="link-btn faint" id="done-btn">閉じる</button>
    </div>
  </section>

</main>

<script src="audio-map.js?v=64"></script>
<script src="data.js?v=64"></script>
<script src="passages.js?v=64"></script>
<script src="kammatthana.js?v=64"></script>
<script src="hosshin.js?v=64"></script>
<script src="elders.js?v=64"></script>
<script src="keshiki.js?v=64"></script>
<script src="speech.js?v=64"></script>
<script src="app.js?v=64"></script>
</body>
</html>
