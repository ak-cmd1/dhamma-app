<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>経典</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="経典">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <!-- 画面1:質問 -->
  <section id="screen-question" class="screen">
    <p class="eyebrow">今日は</p>
    <h1 class="question">どんな気分ですか</h1>
    <div class="choices" id="choices"></div>
  </section>

  <!-- 画面2:苦→集→滅→道 -->
  <section id="screen-stage" class="screen" hidden>
    <div class="progress" id="progress"></div>
    <div class="stage-card">
      <p class="stage-title" id="stage-title"></p>
      <p class="stage-sutra" id="stage-sutra"></p>
      <p class="stage-text" id="stage-text"></p>
    </div>
    <div class="actions">
      <button class="btn-primary" id="next-btn">次へ</button>
    </div>
    <button class="link-btn" id="restart-from-stage">最初から選び直す</button>
  </section>

  <!-- 画面3:締め -->
  <section id="screen-closing" class="screen" hidden>
    <p class="closing-text" id="closing-text"></p>
    <div class="actions">
      <button class="btn-primary" id="restart-btn">もう一度選ぶ</button>
    </div>
  </section>

</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
